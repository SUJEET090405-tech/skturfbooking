<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turf Booking</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Turf Booking</h1>
    <p>Pick a slot, enter your details, and pay securely via Stripe.</p>
  </header>

  <main>
    <section class="card" id="booking">
      <h2>Book a turf slot</h2>

      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date" />
      </div>

      <div class="field">
        <label for="slot">Time slot</label>
        <select id="slot">
          <option value="">Loading slots…</option>
        </select>
      </div>

      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your full name" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>

      <div class="field">
        <label for="phone">Phone (optional)</label>
        <input type="tel" id="phone" placeholder="+1 555 123 4567" />
      </div>

      <button id="bookBtn">Book & Pay</button>

      <div id="notice" role="status"></div>
    </section>

    <section class="card" id="recent">
      <h2>Recent bookings</h2>
      <div id="bookingsList">Loading...</div>
    </section>
  </main>

  <footer>
    <p>Demo app — Replace Stripe keys with your own and use a database for production.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
